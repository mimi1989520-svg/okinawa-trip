<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩五天四夜・家族自駕行程</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182B36;
    --ink-soft:#4B5C64;
    --ocean:#1C5D72;
    --ocean-deep:#12414F;
    --accent:#1C5D72;
    --coral:#C8451B;
    --coral-soft:#F4E3D8;
    --sand:#FAF3E6;
    --card:#FFFFFF;
    --leaf:#4F7A5B;
    --gold:#B9791E;
    --line:#E6DAC2;
    --radius-card:16px;
    --radius-pill:999px;
    color-scheme:light;
  }
  /* Dark mode: the hero / sticky day-nav / boarding-pass ticket keep their own
     fixed colors on purpose (they're always a coloured band, not page background),
     everything else (body text, cards, timeline) swaps to a dark-friendly palette. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDE7D9;
      --ink-soft:#A7B4B9;
      --accent:#5FB4CC;
      --coral:#FF8F5E;
      --coral-soft:#2E2118;
      --sand:#12181B;
      --card:#1C2528;
      --leaf:#86C99A;
      --gold:#E3AE5A;
      --line:#2C373A;
      color-scheme:dark;
    }
    :root:not([data-theme="light"]) .meal-tag.breakfast{background:#1F2A1D;}
    :root:not([data-theme="light"]) .meal-tag.lunch{background:#2E2410;}
    :root:not([data-theme="light"]) .meal-tag.dinner{background:#2A1F2E;color:#D9A0E3;}
  }
  :root[data-theme="dark"]{
    --ink:#EDE7D9;
    --ink-soft:#A7B4B9;
    --accent:#5FB4CC;
    --coral:#FF8F5E;
    --coral-soft:#2E2118;
    --sand:#12181B;
    --card:#1C2528;
    --leaf:#86C99A;
    --gold:#E3AE5A;
    --line:#2C373A;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(165deg,var(--ocean) 0%,var(--ocean-deep) 100%);
    color:#F3EFE4;
    padding:36px 0 28px;
  }
  .hero .wrap{padding:0 24px;}
  .hero-kicker{
    font-size:14px;
    letter-spacing:.02em;
    color:#BFE0E8;
    margin:0 0 10px;
  }
  .hero h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:26px;
    line-height:1.5;
    margin:0 0 16px;
    max-width:22em;
  }
  .hero-dates{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22);
    color:#F3EFE4;
    padding:7px 14px;
    border-radius:var(--radius-pill);
    font-size:14px;
    font-weight:500;
    margin-bottom:22px;
  }

  .flight-row{display:flex;flex-direction:column;gap:12px;}
  .boardingpass{
    background:#F3EFE4;
    color:#182B36;
    border-radius:14px;
    display:flex;
    overflow:hidden;
  }
  .bp-main{flex:1;padding:14px 14px;}
  .bp-label{
    font-size:12px;
    color:#4B5C64;
    margin:0 0 8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .bp-flight{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0;
    border-top:1px dashed var(--line);
  }
  .bp-flight:first-of-type{border-top:none;}
  .bp-code{
    font-weight:700;
    font-size:14px;
    min-width:58px;
  }
  .bp-code.hl{color:#C8451B;}
  .bp-time{
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
  }
  .bp-route{
    font-size:12px;
    color:#4B5C64;
  }
  .bp-arrow{color:#4B5C64;font-size:13px;}

  /* ---------- Sticky day nav ---------- */
  .day-nav{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--ocean-deep);
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .day-nav-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 20px;
    scrollbar-width:none;
  }
  .day-nav-scroll::-webkit-scrollbar{display:none;}
  .tab{
    position:relative;
    flex:0 0 auto;
    background:#F3EFE4;
    color:#182B36;
    border:none;
    border-radius:10px;
    padding:8px 14px 8px 20px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    text-align:left;
    cursor:pointer;
    opacity:.62;
    transition:opacity .15s ease, transform .15s ease;
  }
  .tab::before{
    content:'';
    position:absolute;
    left:7px;
    top:50%;
    transform:translateY(-50%);
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--ocean-deep);
  }
  .tab .tab-date{
    display:block;
    font-weight:500;
    font-size:11px;
    color:#4B5C64;
    margin-top:1px;
  }
  .tab[aria-selected="true"]{
    opacity:1;
    background:#fff;
    transform:translateY(-1px);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .tab[aria-selected="true"]::before{background:var(--coral);}

  /* ---------- Panels ---------- */
  main{padding:24px 0 60px;}
  .panel{display:none;}
  .panel.active{
    display:block;
    animation:rise .28s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .panel.active{animation:none;}
  }

  /* Overview panel */
  .ov-intro{font-size:15px;color:var(--ink-soft);margin:0 0 22px;}
  .ov-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .ov-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    text-align:left;
    width:100%;
    font-family:inherit;
    color:inherit;
  }
  .ov-daynum{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:22px;
    color:var(--accent);
    min-width:34px;
  }
  .ov-item-body{flex:1;min-width:0;}
  .ov-item-date{font-size:12px;color:var(--ink-soft);margin:0 0 3px;}
  .ov-item-tag{font-size:14px;font-weight:500;margin:0;}
  .ov-item-hotel{font-size:12px;color:var(--leaf);margin:4px 0 0;}
  .ov-chevron{color:var(--ink-soft);flex:0 0 auto;}

  .ov-note{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--coral-soft);
    border-radius:12px;
    padding:12px 14px;
  }

  /* Day panel */
  .day-head{margin-bottom:20px;}
  .day-head .d-num{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    color:var(--accent);
    font-size:14px;
    margin:0 0 4px;
  }
  .day-head h2{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 8px;
  }
  .day-head p{margin:0;color:var(--ink-soft);font-size:14px;}

  .meal-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:var(--radius-pill);
    margin-bottom:10px;
  }
  .meal-tag.breakfast{background:#EAF1E4;color:var(--leaf);}
  .meal-tag.lunch{background:#FBEFD9;color:var(--gold);}
  .meal-tag.dinner{background:#EFE1EE;color:#7A4B87;}

  .place-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .place-card .pc-name{font-weight:700;font-size:15px;}
  .place-card a.maplink{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--accent);
    padding:6px 10px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
  }

  .timeline{
    position:relative;
    margin:0 0 26px;
    padding-left:2px;
  }
  .t-row{
    position:relative;
    display:flex;
    gap:14px;
    padding:0 0 20px 0;
  }
  .t-row:last-child{padding-bottom:0;}
  .t-rail{
    position:relative;
    width:14px;
    flex:0 0 auto;
    display:flex;
    justify-content:center;
  }
  .t-rail::before{
    content:'';
    position:absolute;
    top:16px;
    bottom:-20px;
    left:50%;
    width:1px;
    background:var(--line);
    transform:translateX(-50%);
  }
  .t-row:last-child .t-rail::before{display:none;}
  .t-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    margin-top:5px;
    flex:0 0 auto;
  }
  .t-row.act-food .t-dot{background:var(--gold);}
  .t-row.act-nature .t-dot{background:var(--leaf);}
  .t-body{flex:1;min-width:0;padding-top:0;}
  .t-time{
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 2px;
  }
  .t-text{
    font-size:15px;
    font-weight:500;
    margin:0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
  }
  .t-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:3px 0 0;
  }
  .pin{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:12px;
    font-weight:700;
    color:var(--coral);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .pin:hover{border-bottom-color:var(--coral);}
  .pin svg{width:12px;height:12px;}

  .hotel-card{
    background:var(--ocean);
    color:#F3EFE4;
    border-radius:var(--radius-card);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }
  .hotel-card .hc-icon{flex:0 0 auto;opacity:.9;}
  .hotel-card .hc-body{flex:1;min-width:0;}
  .hotel-card .hc-label{font-size:11px;color:#BFE0E8;margin:0 0 3px;}
  .hotel-card .hc-name{font-size:15px;font-weight:700;margin:0;}
  .hotel-card a.hc-link{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--ocean-deep);
    background:#F3EFE4;
    text-decoration:none;
    padding:8px 12px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
  }

  footer{
    padding:20px 0 40px;
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
  }

  @media (min-width:700px){
    .hero h1{font-size:30px;}
    .flight-row{flex-direction:row;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">

    <span class="hero-dates">2027.3.12（五）→ 2027.3.16（二）</span>
    <div class="flight-row">
      <div class="boardingpass">
        <div class="bp-main">
          <p class="bp-label">✈ 去程・台北 → 沖繩</p>

          </div>

</header>

<nav class="day-nav" aria-label="選擇日期">

<main class="wrap" id="panels"></main>

<footer>

      {time:'14:00', text:'瀨長島', mapHref:'https://maps.app.goo.gl/nPA4p1en5p7Hb5oVA', kind:'nature'},
      {time:'15:00', text:'幸福鬆餅（沖繩店）', map:'幸福鬆餅 沖繩', kind:'food'},
      {time:'16:40', text:'要離開瀨長島'},
      {time:'17:00', text:'OTS 還車', mapHref:'https://maps.app.goo.gl/P9rtv5RHGYyes7s18'},
      {time:'17:30', text:'抵達 OKA 沖繩機場', map:'那霸機場'}
    ]},
    dinner:{place:'機場晚餐', items:[
      {flights:trip.ret, caption:'回程班機・飛回台北'}
    ]},
    hotel:null
  }
];

function flightCardHTML(item){
  const rows = item.flights.map(f => `
    <div class="bp-flight">
      <span class="bp-code${f.hl ? ' hl' : ''}">${f.code}</span>
      <span class="bp-time">${f.time}</span>
    </div>`).join('');
  return `
  <div class="t-row">
    <div class="t-rail"><div class="t-dot" style="background:var(--coral)"></div></div>
    <div class="t-body">
      <div class="boardingpass" style="border:1px solid var(--line)">
        <div class="bp-main">
          <p class="bp-label">✈ ${item.caption}</p>
          ${rows}
        </div>
      </div>
    </div>
  </div>`;
}

function timelineRowHTML(item){
  if(item.flights) return flightCardHTML(item);
  const kindClass = item.kind === 'nature' ? ' act-nature' : (item.kind === 'food' ? ' act-food' : '');
  const href = mapHref(item);
  const pin = href ? `<a class="pin" href="${href}" target="_blank" rel="noopener">${ICONS.pin}地圖</a>` : '';
  const note = item.note ? `<p class="t-note">${item.note}</p>` : '';
  return `
  <div class="t-row${kindClass}">
    <div class="t-rail"><div class="t-dot"></div></div>
    <div class="t-body">
      <p class="t-time">${item.time}</p>
      <p class="t-text">${item.text}${pin}</p>
      ${note}
    </div>
  </div>`;
}

function mealBlockHTML(mealType, label, meal){
  if(!meal) return '';
  const place = meal.place ? `
    <div class="place-card">
      <span class="pc-name">${meal.place}</span>
      ${meal.map || meal.mapHref ? `<a class="maplink" href="${mapHref(meal)}" target="_blank" rel="noopener">開啟地圖</a>` : ''}
    </div>` : '';
  const items = (meal.items || []).map(timelineRowHTML).join('');
  return `
    <span class="meal-tag ${mealType}">${label}</span>
    ${place}
    ${items ? `<div class="timeline">${items}</div>` : ''}
  `;
}

function dayPanelHTML(d){
  const breakfastHTML = d.breakfast ? `
    <span class="meal-tag breakfast">早餐</span>
    <div class="place-card">
      <span class="pc-name">${d.breakfast.place}</span>
      ${d.breakfast.map || d.breakfast.mapHref ? `<a class="maplink" href="${mapHref(d.breakfast)}" target="_blank" rel="noopener">開啟地圖</a>` : ''}
    </div>` : '';

  const morningHTML = d.morning ? `<div class="timeline">${d.morning.map(timelineRowHTML).join('')}</div>` : '';

  const hotelHTML = d.hotel ? `
    <div class="hotel-card">
      <span class="hc-icon">${ICONS.bed}</span>
      <div class="hc-body">
        <p class="hc-label">今晚住宿</p>
        <p class="hc-name">${d.hotel.name}</p>
      </div>
      <a class="hc-link" href="${mapHref(d.hotel)}" target="_blank" rel="noopener">導航</a>
    </div>` : '';

  return `
    <div class="day-head">
      <p class="d-num">Day ${d.num}</p>
      <h2>${d.date}（${d.weekday}）</h2>
      <p>${d.tag}</p>
    </div>
    ${breakfastHTML}
    ${morningHTML}
    ${mealBlockHTML('lunch','午餐', d.lunch)}
    ${mealBlockHTML('dinner','晚餐', d.dinner)}
    ${hotelHTML}
  `;
}

function overviewHTML(){
  const rows = days.map(d => `
    <button class="ov-item" data-goto="${d.id}">
      <span class="ov-daynum">${d.num}</span>
      <span class="ov-item-body">
        <span class="ov-item-date">${d.date}（${d.weekday}）</span>
        <p class="ov-item-tag">${d.tag}</p>
        ${d.hotel ? `<p class="ov-item-hotel">🏨 ${d.hotel.name}</p>` : `<p class="ov-item-hotel">✈ 晚間飛回台北</p>`}
      </span>
      <span class="ov-chevron">${ICONS.chevron}</span>
    </button>
  `).join('');
  return `
    <p class="ov-intro">五天四夜的行程總覽，點任一天可以直接跳到當天的詳細時間表。</p>
    <div class="ov-list">${rows}</div>
    <p class="ov-note">👶 部分行程含孩子的放電行程（溜滑梯、沙灘），時間抓得比較鬆，可依現場狀況調整。</p>
  `;
}

// ---- render ----
const panelsEl = document.getElementById('panels');
const navEl = document.getElementById('dayNavScroll');

let panelsHTML = `<section class="panel active" id="panel-overview">${overviewHTML()}</section>`;
days.forEach(d => {
  panelsHTML += `<section class="panel" id="panel-${d.id}">${dayPanelHTML(d)}</section>`;
});
panelsEl.innerHTML = panelsHTML;

let navHTML = `<button class="tab" data-target="overview" aria-selected="true">總覽</button>`;
days.forEach(d => {
  navHTML += `<button class="tab" data-target="${d.id}" aria-selected="false">Day ${d.num}<span class="tab-date">${d.date.slice(5)}（${d.weekday}）</span></button>`;
});
navEl.innerHTML = navHTML;

function showPanel(target){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + target).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-selected', t.dataset.target === target ? 'true' : 'false');
  });
  const activeTab = document.querySelector(`.tab[data-target="${target}"]`);
  if(activeTab) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  window.scrollTo({top:0, behavior:'smooth'});
}

navEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  showPanel(btn.dataset.target);
});

panelsEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-goto]');
  if(!btn) return;
  showPanel(btn.dataset.goto);
});
</script>
</body>
</html>
